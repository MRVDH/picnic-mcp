name: Publish

# Stages a new npm version when a GitHub release is published, and attaches the MCPB bundle to the
# release. The release tag must match the version in package.json, e.g. v0.1.0 for 0.1.0.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the bundle to the release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in release builds

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Attach the MCPB bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run bundle
          gh release upload "$GITHUB_REF_NAME" picnic-mcp.mcpb

      # Staged: the version goes live after a maintainer approves it on npmjs.com with 2FA.
      - run: npm stage publish
